# ─────────────────────────────────────────────────────────────────────────────
# Release — runs when a GitHub Release is published.
#
#   build (ci.yml, release mode) ──► publish-npm (environment "npm-publish")
#
# publish-npm `needs: build` → it does not run unless the build + tests pass.
# Storybook is published from main by pages.yml, not from here.
# No token is hard-coded: NPM_TOKEN lives as a secret on the "npm-publish"
# environment (see .github/RELEASING.md).
# ─────────────────────────────────────────────────────────────────────────────
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      release: true

  # ── npm ───────────────────────────────────────────────────────────────────
  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/${{ needs.build.outputs.package-name }}/v/${{ needs.build.outputs.package-version }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: pkg

      - name: Publish
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NAME: ${{ needs.build.outputs.package-name }}
          VERSION: ${{ needs.build.outputs.package-version }}
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is missing on the 'npm-publish' environment."
            exit 1
          fi
          if npm view "${NAME}@${VERSION}" version > /dev/null 2>&1; then
            echo "::notice::${NAME}@${VERSION} is already on npm — nothing to publish."
            exit 0
          fi
          # Leading "./" is required: npm reads "pkg/x.tgz" as GitHub shorthand (owner/repo).
          npm publish ./pkg/*.tgz --access public --provenance --tag "$DIST_TAG"
          echo "::notice::Published ${NAME}@${VERSION} (dist-tag: ${DIST_TAG})"
